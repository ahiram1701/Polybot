openapi: 3.0.3
info:
  title: Polybot Control API
  version: "0.1.0"
  description: >
    API HTTP local de Polybot (bot de trading Polymarket cripto Up/Down 5m).
    Es el unico plano de control: la UI, el servidor MCP y la CLI la usan.
    Sin autenticacion; pensada para uso local (127.0.0.1). live mueve dinero real.
servers:
  - url: http://127.0.0.1:8787
    description: Servidor local por defecto
tags:
  - name: estado
  - name: analisis
  - name: control
  - name: notificaciones
paths:
  /api/status:
    get:
      tags: [estado]
      summary: Estado completo del bot
      responses:
        "200":
          description: Estado actual
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /api/trades:
    get:
      tags: [estado]
      summary: Trades recientes (mas nuevos primero)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Lista de trades
          content:
            application/json:
              schema:
                type: object
                properties:
                  trades:
                    type: array
                    items: { type: object }
  /api/settings:
    get:
      tags: [control]
      summary: Settings actuales
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    patch:
      tags: [control]
      summary: Aplica un patch parcial de settings
      description: Responde 409 si el bot esta corriendo. Detén el bot primero.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200":
          description: Settings resultantes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/analysis/strategies:
    get:
      tags: [analisis]
      summary: EV historico por estrategia
      responses:
        "200":
          description: Analisis de estrategias
          content: { application/json: { schema: { type: object } } }
  /api/analysis/recommendations:
    get:
      tags: [analisis]
      summary: Recomendaciones del modelo predictivo (walk-forward + k-NN)
      responses:
        "200":
          description: Recomendaciones por mercado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recommendations" }
  /api/analysis/setup-ev:
    get:
      tags: [analisis]
      summary: EV historico agregado de un setup (mercado/lado/ventana/distancia/cap)
      parameters:
        - { name: market, in: query, required: true, schema: { type: string, enum: [BTC, ETH, DOGE] } }
        - { name: outcome, in: query, required: true, schema: { type: string, enum: [UP, DOWN] } }
        - { name: entryWindowSeconds, in: query, required: true, schema: { type: number } }
        - { name: minDistanceUsd, in: query, required: true, schema: { type: number } }
        - { name: maxAskPrice, in: query, required: true, schema: { type: number } }
        - { name: capitalUsd, in: query, required: false, schema: { type: number } }
      responses:
        "200":
          description: Metricas del setup (winCount, tradeCount, winRate, evRoi, edge, ...)
          content:
            application/json:
              schema: { type: object }
  /api/analysis/ask-bands:
    get:
      tags: [analisis]
      summary: Rendimiento realizado por banda de ask (post-reset, resoluciones oficiales) para decidir el ask cap
      parameters:
        - { name: mode, in: query, required: false, schema: { type: string, enum: [live, sim] } }
      responses:
        "200":
          description: Bandas con trades, win rate, break-even (ask promedio) y net USD
          content: { application/json: { schema: { type: object } } }
  /api/analysis/samples/export:
    get:
      tags: [analisis]
      summary: Exporta las muestras de Analisis como NDJSON
      responses:
        "200":
          description: Archivo .jsonl
          content:
            application/x-ndjson:
              schema: { type: string }
  /api/analysis/samples/import:
    post:
      tags: [analisis]
      summary: Importa muestras de Analisis (.jsonl)
      description: Responde 409 si el bot esta corriendo. Maximo 512MB.
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
      responses:
        "200":
          description: Resumen de import
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisImport" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/fiscal/summary:
    get:
      tags: [fiscal]
      summary: Resumen fiscal anual/mensual de trades LIVE resueltos (USD y MXN si hay tipo de cambio)
      parameters:
        - { name: year, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: Resumen + config de tipo de cambio (el token Banxico nunca se expone, solo si esta configurado)
          content: { application/json: { schema: { type: object } } }
  /api/fiscal/export:
    get:
      tags: [fiscal]
      summary: Exporta CSV fiscal del anio (BOM UTF-8, compatible Excel)
      parameters:
        - { name: year, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: Archivo .csv (fecha, mercado, lado, invertido, comision, recibido, ganancia USD/MXN)
          content:
            text/csv:
              schema: { type: string }
  /api/fiscal/fx:
    post:
      tags: [fiscal]
      summary: Configura tipo de cambio USD/MXN (token Banxico y/o tasas manuales por fecha o mes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                banxicoToken: { type: string, description: "Token SIE de Banxico; cadena vacia lo borra" }
                manualRates: { type: object, description: "'YYYY-MM-DD' o 'YYYY-MM' -> tasa; null elimina" }
                year: { type: integer }
      responses:
        "200":
          description: Resumen fiscal actualizado
          content: { application/json: { schema: { type: object } } }
  /api/notifications/telegram:
    get:
      tags: [notificaciones]
      summary: Config de Telegram (sin exponer el token)
      responses:
        "200":
          description: Config
          content: { application/json: { schema: { type: object } } }
    patch:
      tags: [notificaciones]
      summary: Actualiza config de Telegram
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                botToken: { type: string }
                chatId: { type: string }
                publicUrl: { type: string }
      responses:
        "200":
          description: Config resultante
          content: { application/json: { schema: { type: object } } }
  /api/notifications/telegram/test:
    post:
      tags: [notificaciones]
      summary: Envia un mensaje de prueba
      responses:
        "200":
          description: Resultado
          content: { application/json: { schema: { type: object } } }
        "409": { $ref: "#/components/responses/Error" }
  /api/analysis/ollama:
    post:
      tags: [analisis]
      summary: Analisis LLM via Ollama Cloud (solo texto)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string, minLength: 1 }
      responses:
        "200":
          description: Analisis generado
          content: { application/json: { schema: { type: object } } }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /api/bot/start:
    post:
      tags: [control]
      summary: Arranca el bot
      description: mode 'live' MUEVE DINERO REAL y requiere confirmLive true mas llaves en .env.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [sim, live] }
                confirmLive: { type: boolean }
      responses:
        "200":
          description: Estado tras arrancar
          content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/bot/stop:
    post:
      tags: [control]
      summary: Detiene el bot
      responses:
        "200":
          description: Estado tras detener
          content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } }
  /api/bot/reset:
    post:
      tags: [control]
      summary: Limpia estado y trades (conserva settings)
      responses:
        "200":
          description: Estado tras reset
          content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } }
  /api/pnl/reset:
    post:
      tags: [control]
      summary: Resetea el P&L mostrado de un modo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [sim, live] }
      responses:
        "200":
          description: Estado tras reset de P&L
          content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } }
  /api/events:
    get:
      tags: [estado]
      summary: Stream SSE de status y logs
      responses:
        "200":
          description: Eventos server-sent (text/event-stream)
          content:
            text/event-stream:
              schema: { type: string }
components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              issues: { type: array, items: { type: object } }
  schemas:
    Status:
      type: object
      properties:
        running: { type: boolean }
        mode: { type: string, enum: [sim, live], description: Modo de ARRANQUE. Puede no reflejar si hay dinero en juego, ver effectiveModes. }
        effectiveModes:
          type: object
          description: >-
            Modo ya resuelto de cada estrategia. Es la fuente de verdad sobre si se mueve dinero real:
            un bot arrancado en sim puede tener el arbitraje en live.
          properties:
            arb: { type: string, enum: [sim, live] }
            directional: { type: string, enum: [sim, live] }
        startedAtMs: { type: number }
        lastError: { type: string }
        settings: { $ref: "#/components/schemas/Settings" }
        markets: { type: array, items: { type: object } }
        signal: { type: object }
        dailySpendUsd: { type: number }
        bankroll:
          type: object
          description: Capital efectivo que usa la guardia del arbitraje, y de donde salio.
          properties:
            usd: { type: number }
            source:
              type: string
              enum: [onchain, declared, unknown]
              description: "unknown = ni lectura ni declarado: el arbitraje NO opera."
            atMs: { type: number, description: Cuando se leyo on-chain por ultima vez. }
            staleReadingMs:
              type: number
              description: Presente solo si habia lectura on-chain y caduco. Distingue "nunca leyo" de "el RPC murio".
        loopHealth:
          type: object
          properties:
            iterations: { type: integer }
            failed: { type: integer }
            failedPct: { type: number }
            lagMaxMs: { type: number, description: Peor bloqueo del bucle de eventos en la ventana. }
        pnl: { type: object, description: P&L post-reset (desde el ultimo reset) agregado. }
        pnlByMode: { type: object, description: P&L post-reset por modo (sim/live). }
        pnlHistoricalByMode: { type: object, description: P&L de por vida por modo (todos los trades, ignora el reset). }
        pnlResetAtMs:
          type: object
          description: Epoch ms del ultimo reset de P&L por modo (clave sim/live; ausente = nunca reseteado).
        logs: { type: array, items: { type: object } }
    Settings:
      type: object
      description: Settings del bot (todas las claves opcionales en PATCH).
      properties:
        arbMode:
          type: string
          enum: [heredado, sim, live]
          description: >-
            Modo del arbitraje, independiente del direccional. "heredado" usa el modo de arranque.
            Ponerlo en "live" NO pide confirmacion y cualquier reinicio lo reanuda; exige clave en .env.
        directionalMode:
          type: string
          enum: [heredado, sim, live]
          description: Modo del direccional, independiente del arbitraje. Mismas advertencias que arbMode.
        # --- Limites de riesgo. Cual aplica a que estrategia esta en docs/MANUAL.md seccion 6. ---
        maxDailyLossUsd:
          type: number
          description: Perdida realizada del dia que detiene el DIRECCIONAL. 0 = desactivado. NO frena el arbitraje.
        maxConsecutiveLosses:
          type: integer
          description: Mismo freno por racha en vez de por importe. 0 = desactivado. NO frena el arbitraje.
        riskHaltCooldownHours:
          type: number
          description: Tras saltar el freno, horas hasta rearmarse. No espera al cambio de dia.
        minBankrollForDirectionalUsd:
          type: number
          description: Capital minimo para que el direccional opere en live. El arbitraje no pasa por esta puerta.
        liveBankrollUsd:
          type: number
          description: >-
            Capital declarado, respaldo de la lectura on-chain. Entra en dos casos: si nunca se pudo
            leer, y si la ultima lectura CADUCO (5 min sin refrescar). Ponlo algo por debajo del saldo
            real: es el que dimensiona si el RPC se cae. Sin el, el arbitraje deja de operar.
        dailySpendLimitUsd:
          type: number
          description: Tope bruto de gasto del dia, contado POR MODO (las operaciones de papel no consumen el presupuesto real).
        liveMaxSlippage:
          type: number
          description: Cuanto puede alejarse el precio de la orden del mejor ask observado.
        maxAskPriceCeiling:
          type: number
          description: Techo duro de ask para cualquier trade y para el autoajuste.
        # --- Arbitraje ---
        arbEnabled: { type: boolean }
        arb15mEnabled:
          type: boolean
          description: Arbitraje tambien en ventanas de 15m. SOLO arbitraje; el direccional sigue en 5m.
        arbMaxUsdPerOpportunity:
          type: number
          description: >-
            Presupuesto de las dos patas juntas, y TECHO del tamano. El tamano real es
            min(este presupuesto, hueco del limite diario, colateral libre en live, profundidad del
            libro). Subir el capital sin subir este numero NO cambia nada.
        arbMinNetPerSet:
          type: number
          description: Margen minimo por set tras comisiones para mandar el par.
        arbNakedLegHaltStreak:
          type: integer
          minimum: 1
          maximum: 10
          description: >-
            Patas sueltas seguidas antes de dejar de intentar arbitrajes. Una pata suelta es una apuesta
            direccional que nadie pidio. Rearma al reiniciar el bot, no solo.
        minBtcDistanceUsd: { type: number }
        enabledMarkets:
          type: array
          items: { type: string, enum: [BTC, ETH, DOGE] }
        minDistanceUsdByMarket: { type: object }
        entryWindowSeconds: { type: number }
        entryWindowSecondsByMarket: { type: object }
        simTradeAmountUsd: { type: number }
        liveTradeAmountUsd: { type: number }
        autoMinLive: { type: boolean }
        maxAskPrice: { type: number }
        tickStaleMs: { type: number }
        pollIntervalMs: { type: number }
        openingCaptureGraceMs: { type: number }
        timezone: { type: string }
        maxAnalyticsSamples:
          type: integer
          description: Retencion de muestras de analitica. Subirlo tiene coste real, ver docs/ARQUITECTURA.md.
        # --- Los TRES autoajustes. El spec solo documentaba el primero. ---
        aiAutoApplyLive:
          type: boolean
          description: Ajusta ventana y distancia por mercado en caliente, con 30 min de enfriamiento.
        aiAutoTuneAskCap:
          type: boolean
          description: Mueve el techo de ask. Solo ESTRECHA, nunca abre, asi que solo reduce exposicion.
        aiAutoProbeBands:
          type: boolean
          description: >-
            Prueba bandas de ask nuevas. El UNICO autoajuste que puede ABRIR la ventana y por tanto
            aumentar el riesgo. Presupuesto de sondeo acotado por mercado y dia.
        # --- Gate de EV: decide si el direccional entra. ---
        requirePositiveEv:
          type: boolean
          description: Apaga el gate de valor esperado entero.
        evSafetyMargin: { type: number }
        evMinExpectedRoi: { type: number }
        evMinHistoryTrades: { type: integer }
        evUseSimilarity: { type: boolean }
        evCalibration: { type: boolean }
        explorationEnabled: { type: boolean }
        minFillRatio: { type: number }
        # --- Banda de ask real, por mercado y lado. Las variantes ByMarket son las antiguas. ---
        minAskPriceByMarketOutcome: { type: object }
        maxAskPriceByMarketOutcome: { type: object }
        minDistanceFloorUsdByMarket: { type: object }
        enabledMarketOutcomes: { type: object }
        minDistanceUsdByMarketOutcome: { type: object }
        entryWindowSecondsByMarketOutcome: { type: object }
    Recommendations:
      type: object
      properties:
        generatedAtMs: { type: number }
        recommendations:
          type: array
          items:
            type: object
            properties:
              market: { type: string, enum: [BTC, ETH, DOGE] }
              status: { type: string, enum: [insufficient_data, ready] }
              confidence: { type: string, enum: [low, medium, high] }
              canApply: { type: boolean }
              canAutoApply: { type: boolean }
              recommended: { type: object }
              reason: { type: string }
    AnalysisImport:
      type: object
      properties:
        importedCount: { type: integer }
        duplicateCount: { type: integer }
        skippedInvalidCount: { type: integer }
        totalKnownSamples: { type: integer }
        firstSampleAtMs: { type: number }
        lastSampleAtMs: { type: number }
